    window.storage={
      get:async(k)=>{try{const v=localStorage.getItem(k);if(v===null)throw new Error('not found');return{key:k,value:v};}catch(e){throw e;}},
      set:async(k,v)=>{try{localStorage.setItem(k,v);return{key:k,value:v};}catch(e){return null;}},
      delete:async(k)=>{try{localStorage.removeItem(k);return{key:k,deleted:true};}catch(e){return null;}},
      list:async(pfx)=>{try{const keys=Object.keys(localStorage).filter(k=>!pfx||k.startsWith(pfx));return{keys};}catch(e){return{keys:[]};}}
    };

// ─── UTILS ────────────────────────────────────────────────────────────────────
const fmtDT  = (iso) => !iso ? "—" : new Date(iso).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtNum = (n,dec=2) => (n===""||n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toFixed(dec);
const calcLots=(bal,rp,en,sl,tk,contractSizeManual)=>{
  const cs=parseFloat(contractSizeManual)||(tk&&TICKERS[tk]?TICKERS[tk].contractSize:0);
  if(!bal||!rp||!en||!sl||!cs) return "";
  const d=Math.abs(parseFloat(en)-parseFloat(sl)); if(!d) return "";
  return Math.round((bal*(parseFloat(rp)/100))/(d*cs)*10000)/10000;
};
const calcRR=(en,sl,tg)=>{
  const e=parseFloat(en),s=parseFloat(sl),t=parseFloat(tg);
  if(!e||!s||!t) return ""; const r=Math.abs(e-s); if(!r) return "";
  return Math.round(Math.abs(t-e)/r*100)/100;
};
const calcPnL=(en,p1,l1,p2,l2,tk,csManual)=>{
  const cs=parseFloat(csManual)||(tk&&TICKERS[tk]?TICKERS[tk].contractSize:0);
  if(!en||!cs) return "";
  const e=parseFloat(en); let pnl=0;
  if(p1&&l1) pnl+=(parseFloat(p1)-e)*parseFloat(l1)*cs;
  if(p2&&l2) pnl+=(parseFloat(p2)-e)*parseFloat(l2)*cs;
  return Math.round(pnl*100)/100;
};

const loadDeals=async()=>{

        followsPlan:r["Сделка по плану"]||"",followsTS:r["Соответствие ТС"]||"",

        plannedRR:r["Plan RR"]||"",entryTime:r["Open (время входа)"]||"",

        account:r["Счет"]||"",htfPOI:r["HTF POI"]||"",ltfEntry:r["LTF Entry"]||"",
        structure:r["Структура"]||"",bos:r["BoS"]||"",ticker:r["Тикер"]||"",
        sl:r["SL"]||"",entry:r["Entry"]||"",target:r["Target"]||"",
        risk:r["Риск %"]||"",lotSize:r["Lots"]||"",rr:r["RR"]||"",
        htfChart:r["HTF Chart"]||"",ltfChart:r["LTF Chart"]||"",
        closeTime:r["Close (время закрытия)"]||"",result:r["Результат"]||"",
        closedByPlan:r["Закрыта по плану"]||"",
        price1:r["Price 1"]||"",lots1:r["Lots 1"]||"",
        price2:r["Price 2"]||"",lots2:r["Lots 2"]||"",pnl:r["PnL"]||"",
        htfClose:r["HTF Close Chart"]||"",ltfClose:r["LTF Close Chart"]||"",
        reason:r["Что привело к решению"]||"",futureBehavior:r["Как буду вести себя"]||"",
      }));
    }
  }catch(e){console.warn("Sheets load failed:",e);}
  try{const r=await window.storage.get("deals2");return r?JSON.parse(r.value):[];}catch{return[];}
};

// ─── SYNC TO GOOGLE SHEETS ────────────────────────────────────────────────────
const syncToSheets = async(deal)=>{
  if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL==="YOUR_APPS_SCRIPT_URL_HERE") return;
  try{
    const row=[
      deal.timestamp,
      deal.dayOfWeek,
      deal.importantNews,
      deal.followsPlan,
      deal.followsTS,
      (deal.feelings||[]).join(", "),
      deal.plannedRR,
      deal.entryTime,
      (deal.session||[]).join(", "),
      deal.account,
      deal.htfPOI,
      deal.ltfEntry,
      deal.structure,
      deal.bos+(deal.bosTF?" "+deal.bosTF:""),
      deal.ticker,
      deal.sl,
      deal.entry,
      deal.target,
      deal.risk,
      deal.lotSize,
      deal.rr,
      deal.htfChart,
      deal.ltfChart,
      deal.closeTime,
      deal.result,
      deal.closedByPlan,
      deal.price1,
      deal.lots1,
      deal.price2,
      deal.lots2,
      deal.pnl,
      deal.htfClose,
      deal.ltfClose,
      deal.reason,
      deal.futureBehavior,
    ];
    await fetch(APPS_SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({type:"trading",row}),
    });
  }catch(err){console.warn("Sheets sync failed:",err);}
};

function useWindowWidth(){
  const [w,setW]=useState(typeof window!=="undefined"?window.innerWidth:800);
  useEffect(()=>{
    const h=()=>setW(window.innerWidth);
    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[]);
  return w;
}

// ─── DESKTOP TABLE ────────────────────────────────────────────────────────────
const COLS=[
  {k:"timestamp",h:"Время",fmt:fmtDT},{k:"dayOfWeek",h:"День"},{k:"importantNews",h:"Новости"},
  {k:"followsPlan",h:"По плану"},{k:"followsTS",h:"ТС"},{k:"feelings",h:"Состояние",fmt:v=>(v||[]).join(", ")},
  {k:"plannedRR",h:"Plan RR"},{k:"entryTime",h:"Open",fmt:fmtDT},{k:"session",h:"Сессия",fmt:v=>(v||[]).join(", ")},
  {k:"account",h:"Счет"},{k:"htfPOI",h:"HTF POI"},{k:"ltfEntry",h:"LTF Entry"},{k:"structure",h:"Структура"},{k:"bos",h:"BoS",fmt:(v,r)=>v?(v+(r?.bosTF?" "+r.bosTF:"")):"—"},
  {k:"ticker",h:"Тикер"},{k:"sl",h:"SL",mono:1},{k:"entry",h:"Entry",mono:1},{k:"target",h:"Target",mono:1},
  {k:"risk",h:"Риск",fmt:v=>v?v+"%":"—"},{k:"lotSize",h:"Lots",mono:1},{k:"rr",h:"RR",mono:1,accent:1},
  {k:"htfChart",h:"HTF",link:1},{k:"ltfChart",h:"LTF",link:1},
  {k:"closeTime",h:"Close",fmt:fmtDT},{k:"result",h:"Результат",result:1},{k:"closedByPlan",h:"По плану"},
  {k:"price1",h:"P1",mono:1},{k:"lots1",h:"L1",mono:1},{k:"price2",h:"P2",mono:1},{k:"lots2",h:"L2",mono:1},
  {k:"pnl",h:"PnL",pnl:1},{k:"reason",h:"Решение",wrap:1},{k:"futureBehavior",h:"Будущее",wrap:1},
];

function DesktopTable({deals,onEdit,onDelete,t}){
  const sorted=[...deals].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const th={padding:"8px 10px",textAlign:"left",color:t.thColor,fontWeight:700,fontSize:10,letterSpacing:"0.07em",textTransform:"uppercase",borderRight:`1px solid ${t.trBd}`,whiteSpace:"nowrap",background:t.thBg};
  const td={padding:"7px 10px",color:t.textSec,borderRight:`1px solid ${t.trBd}`,verticalAlign:"top",textAlign:"left",fontSize:11};
  return(
    <div style={{overflowX:"auto",borderRadius:10,border:`1px solid ${t.cardBd}`}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,tableLayout:"auto"}}>
        <thead><tr>
          <th style={{...th,width:32}}>#</th>
          {COLS.map(c=><th key={c.k} style={{...th,minWidth:c.h.length*9+24}}>{c.h}</th>)}
          <th style={th}>⚙</th>
        </tr></thead>
        <tbody>
          {sorted.map((d,i)=>(
            <tr key={i} style={{background:i%2===0?t.trEven:t.trOdd,borderBottom:`1px solid ${t.trBd}`}}>
              <td style={{...td,color:t.textMuted,textAlign:"center"}}>{sorted.length-i}</td>
              {COLS.map(c=>{
                let v=d[c.k]??"";
                if(c.fmt) v=c.fmt(v);
                if(v===""||v===null||v===undefined) v="—";
                if(c.link&&v!=="—") v=<a href={v} target="_blank" rel="noreferrer" style={{color:"#3b82f6",textDecoration:"none"}}>🔗</a>;
                else if(c.result&&v!=="—"){const rc=v==="Тейк"?t.badgeTake:v==="Стоп"?t.badgeStop:t.badgeOther;v=<span style={{padding:"2px 6px",borderRadius:4,fontSize:10,fontWeight:700,background:rc.bg,color:rc.color}}>{v}</span>;}
                else if(c.pnl&&v!=="—"){const n=parseFloat(v);v=<span style={{color:n>0?"#22c55e":n<0?"#f87171":t.textSec,fontWeight:700}}>{fmtNum(n)}</span>;}
                else if(c.accent) v=<span style={{color:t.accent,fontWeight:700}}>{v}</span>;
                return <td key={c.k} style={{...td,fontFamily:c.mono?"'JetBrains Mono',monospace":"inherit",whiteSpace:c.wrap?"normal":"nowrap",maxWidth:c.wrap?220:undefined,wordBreak:c.wrap?"break-word":undefined}}>{v}</td>;
              })}
              <td style={{...td,whiteSpace:"nowrap"}}>
                <button onClick={()=>onEdit(i)} style={{padding:"3px 6px",borderRadius:4,background:"transparent",border:`1px solid ${t.backBtnBd}`,color:"#60a5fa",cursor:"pointer",fontSize:10,marginRight:3}}>✏️</button>
                <button onClick={()=>onDelete(i)} style={{padding:"3px 6px",borderRadius:4,background:"transparent",border:`1px solid ${t.backBtnBd}`,color:"#f87171",cursor:"pointer",fontSize:10}}>🗑</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function Stats({deals,t,mobile}){
  const closed=deals.filter(d=>d.result);
  const wins=closed.filter(d=>d.result==="Тейк").length,total=closed.length;
  const totalPnL=closed.reduce((s,d)=>s+(parseFloat(d.pnl)||0),0);
  const wr=total?Math.round(wins/total*100):0;
  const avgRR=closed.length?(closed.reduce((s,d)=>s+(parseFloat(d.rr)||0),0)/closed.length).toFixed(2):"—";
  const box=(label,value,color)=>(
    <div style={{background:t.statBg,borderRadius:9,padding:mobile?"10px 12px":"12px 14px",border:`1px solid ${t.statBd}`,flex:1,minWidth:0}}>
      <div style={{fontSize:9,color:t.textMuted,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:3}}>{label}</div>
      <div style={{fontSize:mobile?18:20,fontWeight:800,color,fontFamily:"'JetBrains Mono',monospace"}}>{value}</div>
    </div>
  );
  return(
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
      {box("Всего",deals.length,"#60a5fa")}
      {box("Win %",`${wr}%`,wr>=50?"#22c55e":"#f87171")}
      {box("Avg RR",avgRR,t.accent)}
      {box("PnL",`${totalPnL>=0?"+":""}${fmtNum(totalPnL)}`,totalPnL>=0?"#22c55e":"#f87171")}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function TradingJournal(){
  const [isDark,setIsDark]=useState(true);
  const t=isDark?DARK:LIGHT;
  const w=useWindowWidth(); const mobile=w<640;

  const [tab,setTab]=useState("pre");
  const [view,setView]=useState("form");
  const [deals,setDeals]=useState([]);
  const [editIdx,setEditIdx]=useState(null);
  const [loading,setLoading]=useState(true);
  const [showDaily,setShowDaily]=useState(false);
  const [dailyAcc,setDailyAcc]=useState({});
  const [form,setForm]=useState(blank());

  useEffect(()=>{
    (async()=>{
      const [d,da]=await Promise.all([loadDeals(),loadDailyAcc()]);
      setDeals(d);setDailyAcc(da);setLoading(false);
    })();
  },[]);

  const set=(key)=>(val)=>setForm(p=>({...p,[key]:val}));

  const balance=useMemo(()=>{
    if(form.accountManual) return parseFloat(form.accountManual);
    if(!form.account) return 0;
    return parseFloat(dailyAcc[form.account]??DEFAULT_ACCOUNTS[form.account]??0);
  },[form.account,form.accountManual,dailyAcc]);

  const effRisk=useMemo(()=>parseFloat(form.riskCustom||form.risk||0),[form.risk,form.riskCustom]);
  const lotSize=useMemo(()=>calcLots(balance,effRisk,form.entry,form.sl,form.ticker,form.contractSizeManual),[balance,effRisk,form.entry,form.sl,form.ticker,form.contractSizeManual]);
  const lossUsd=useMemo(()=>{
    const lots=parseFloat(lotSize);
    const sl=parseFloat(form.sl),en=parseFloat(form.entry);
    if(!lots||!sl||!en) return "";
    const cs=parseFloat(form.contractSizeManual)||(form.ticker&&TICKERS[form.ticker]?TICKERS[form.ticker].contractSize:0);
    if(!cs) return "";
    return Math.round(Math.abs(sl-en)*lots*cs*100)/100;
  },[lotSize,form.sl,form.entry,form.ticker,form.contractSizeManual]);
  const rr=useMemo(()=>calcRR(form.entry,form.sl,form.target),[form.entry,form.sl,form.target]);
  const pnl=useMemo(()=>calcPnL(form.entry,form.price1,form.lots1,form.price2,form.lots2,form.ticker,form.contractSizeManual),[form.entry,form.price1,form.lots1,form.price2,form.lots2,form.ticker,form.contractSizeManual]);

  const prog=useMemo(()=>({
    pre:[form.dayOfWeek,form.importantNews||form.importantNewsCustom,form.followsPlan||form.followsPlanCustom,form.followsTS,form.feelings.length>0||form.feelingsCustom].filter(Boolean).length/5,
    entry:[form.entryTime,form.account||form.accountManual,form.htfPOI,form.ltfEntry,form.structure,form.ticker,form.sl,form.entry,form.target,effRisk].filter(Boolean).length/10,
    close:[form.closeTime,form.result||form.resultCustom,form.price1,form.lots1].filter(Boolean).length/4,
  }),[form,effRisk]);

  const saveDeal=async()=>{
    const deal={...form,
      timestamp:editIdx!==null?deals[editIdx].timestamp:new Date().toISOString(),
      lotSize,rr,pnl,
      importantNews:form.importantNews||form.importantNewsCustom,
      ticker:form.ticker==="Другое"?(form.tickerCustom||"Другое"):form.ticker,
      bos:form.bos,bosTF:form.bosTF,
      followsPlan:form.followsPlan||form.followsPlanCustom,
      result:form.result||form.resultCustom,
      session:[...form.session,...(form.sessionCustom?[form.sessionCustom]:[])],
      feelings:[...form.feelings,...(form.feelingsCustom?[form.feelingsCustom]:[])],
    };
    const updated=editIdx!==null?deals.map((d,i)=>i===editIdx?deal:d):[deal,...deals];
    setDeals(updated);saveDeals(updated);
    if(editIdx===null) await syncToSheets(deal); // отправка новой сделки в Google Sheets
    setForm(blank());setEditIdx(null);setView("table");setTab("pre");
  };

  const sortedDeals=useMemo(()=>[...deals].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)),[deals]);

  const editDeal=(ti)=>{
    const deal=sortedDeals[ti];
    const ri=deals.indexOf(deal);
    setForm({...blank(),...deal,risk:deal.risk?String(deal.risk):"",riskCustom:""});
    setEditIdx(ri);setView("form");setTab("pre");
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const deleteDeal=(ti)=>{
    const deal=sortedDeals[ti];
    const updated=deals.filter(d=>d!==deal);
    setDeals(updated);saveDeals(updated);
  };

  const TABS=[
    {id:"pre",  label:"Pre",  sub:"Перед",  icon:"◉"},
    {id:"entry",label:"Entry",sub:"Вход",   icon:"▶"},
    {id:"close",label:"Close",sub:"Выход",  icon:"■"},
  ];

  const nBtn={padding:mobile?"14px 20px":"11px 24px",borderRadius:10,background:t.nextBtnBg,border:"none",color:t.nextBtnColor,fontWeight:800,fontSize:mobile?15:13,cursor:"pointer",boxShadow:`0 3px 14px ${t.accent}40`,touchAction:"manipulation",flex:mobile?1:undefined};
  const bBtn={padding:mobile?"14px 16px":"11px 20px",borderRadius:10,background:"transparent",border:`1px solid ${t.backBtnBd}`,color:t.backBtnColor,fontWeight:600,fontSize:mobile?15:13,cursor:"pointer",touchAction:"manipulation"};

  if(loading) return(
    <div style={{minHeight:"100vh",background:DARK.bg,display:"flex",alignItems:"center",justifyContent:"center",color:DARK.accent,fontFamily:"monospace",fontSize:14}}>
      Загрузка...
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:t.bg,fontFamily:"'DM Sans','Segoe UI',sans-serif",color:t.textPrim}}>
      
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>

      {showDaily&&<DailyEditor accounts={dailyAcc} setAccounts={setDailyAcc} onClose={()=>setShowDaily(false)} t={t} mobile={mobile}/>}

      {/* HEADER */}
      <div style={{background:t.headerBg,borderBottom:`1px solid ${t.headerBd}`,padding:`0 ${mobile?14:24}px`,display:"flex",alignItems:"center",justifyContent:"space-between",height:mobile?52:56,position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:mobile?8:12}}>
          <div style={{width:34,height:34,borderRadius:8,background:`linear-gradient(135deg,${t.accent},#0080c0)`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:13,color:"#fff",flexShrink:0}}>TJ</div>
          <div>
            <div style={{fontSize:mobile?13:14,fontWeight:800,color:t.textPrim}}>Trading Journal</div>
            {!mobile&&<div style={{fontSize:10,color:t.accentText,letterSpacing:"0.05em"}}>ДНЕВНИК СДЕЛОК</div>}
          </div>
        </div>
        <div style={{display:"flex",gap:mobile?6:8,alignItems:"center"}}>
          <a href="/TJ/index.html" style={{width:mobile?38:36,height:mobile?38:36,borderRadius:8,background:"transparent",border:`1px solid ${t.cardBd}`,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none",touchAction:"manipulation"}} title="На главную">🏠</a>
          <button onClick={()=>setIsDark(d=>!d)}
            style={{width:mobile?38:36,height:mobile?38:36,borderRadius:8,background:"transparent",border:`1px solid ${t.cardBd}`,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",touchAction:"manipulation"}}>
            {isDark?"☀️":"🌙"}
          </button>
          <a href="https://docs.google.com/forms/d/e/YOUR_DAILY_FORM_ID/viewform" target="_blank" rel="noreferrer"
            style={{padding:mobile?"8px 10px":"6px 12px",borderRadius:7,background:"transparent",border:`1px solid ${t.accentBd}`,color:t.accentText,textDecoration:"none",fontSize:mobile?13:11,fontWeight:600,display:"flex",alignItems:"center",gap:4,touchAction:"manipulation"}}>

                      <span style={{fontSize:mobile?13:13,fontWeight:700,color:active?t.textPrim:t.textSec}}>{tb.label}</span>
                    </div>
                    <div style={{fontSize:10,color:active?t.accentText:t.textMuted,marginTop:1}}>{tb.sub}</div>
                    <div style={{marginTop:6,height:3,borderRadius:2,background:t.divider,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${pct}%`,background:pct===100?t.accent:t.accentText,borderRadius:2,transition:"width 0.4s"}}/>
                    </div>
                  </button>
                );
              })}
            </div>

            {/* PRE TAB */}
            {tab==="pre"&&(
              <div style={{animation:"fadeIn 0.25s ease"}}>
                <Card title="Перед сделкой" icon="📅" t={t}>
                  <F label="День недели" required t={t}>
                    <DayPicker value={form.dayOfWeek} onChange={set("dayOfWeek")} t={t} mobile={mobile}/>
                  </F>
                  <Hr t={t}/>
                  <F label="Важные новости?" t={t}>
                    <RadioPill options={["Да","Нет"]} value={form.importantNews} onChange={v=>{set("importantNews")(v);if(v)set("importantNewsCustom")("");}} cols={2} t={t} mobile={mobile}/>
                    <div style={{marginTop:8}}>
                      <Inp value={form.importantNewsCustom} onChange={v=>{set("importantNewsCustom")(v);if(v)set("importantNews")("");}} placeholder="Или введите вручную..." t={t} mobile={mobile}/>
                    </div>
                  </F>
                </Card>

                <Card title="Соответствие ТС" icon="📋" t={t}>
                  <F label="Сделка по плану?" t={t}>
                    <RadioPill options={["Да","Нет"]} value={form.followsPlan} onChange={v=>{set("followsPlan")(v);if(v)set("followsPlanCustom")("");}} cols={2} t={t} mobile={mobile}/>
                    <div style={{marginTop:8}}>
                      <Inp value={form.followsPlanCustom} onChange={v=>{set("followsPlanCustom")(v);if(v)set("followsPlan")("");}} placeholder="Или введите вручную..." t={t} mobile={mobile}/>
                    </div>
                  </F>
                  <Hr t={t}/>
                  <F label="Соответствие ТС?" t={t}>
                    <RadioPill options={["Да","Нет"]} value={form.followsTS} onChange={set("followsTS")} cols={2} t={t} mobile={mobile}/>
                  </F>
                </Card>

                <Card title="Состояние" icon="🧠" t={t}>
                  <F label="Какие чувства я испытываю?" t={t}>
                    <CheckPill options={FEELINGS} value={form.feelings} onChange={set("feelings")} t={t} mobile={mobile}/>
                    <div style={{marginTop:8}}>
                      <Inp value={form.feelingsCustom} onChange={set("feelingsCustom")} placeholder="Другое состояние..." t={t} mobile={mobile}/>
                    </div>
                  </F>
                  <Hr t={t}/>
                  <F label="Планируемый RR" t={t}>
                    <Inp type="number" value={form.plannedRR} onChange={set("plannedRR")} placeholder="Например: 3.5" t={t} mobile={mobile}/>
                  </F>
                </Card>

                <div style={{display:"flex",justifyContent:"flex-end"}}>
                  <button onClick={()=>setTab("entry")} style={nBtn}>Далее → Entry</button>
                </div>
              </div>
            )}

            {/* ENTRY TAB */}
            {tab==="entry"&&(
              <div style={{animation:"fadeIn 0.25s ease"}}>
                <Card title="Entry" icon="⏰" t={t}>
                  <F label="Open" required t={t}>
                    <DTInp value={form.entryTime} onChange={set("entryTime")} t={t} mobile={mobile}/>
                  </F>
                  <Hr t={t}/>
                  <F label="Сессия" t={t}>
                    <RadioPill options={SESSIONS_BASE} value={form.session[0]||""} onChange={v=>set("session")(v?[v]:[])} cols={2} t={t} mobile={mobile}/>
                    <div style={{marginTop:8}}>
                      <Inp value={form.sessionCustom} onChange={set("sessionCustom")} placeholder="Другая сессия..." t={t} mobile={mobile}/>
                    </div>
                  </F>
                </Card>

                <Card title="Счет" icon="💼" t={t}>
                  <F label="Торговый счет" required t={t}>
                    <RadioPill options={Object.keys(DEFAULT_ACCOUNTS)} value={form.account} onChange={v=>{set("account")(v);set("accountManual")("");}} cols={3} t={t} mobile={mobile}/>
                  </F>
                  {form.account&&(
                    <div style={{padding:"8px 12px",borderRadius:7,background:t.accentDim,border:`1px solid ${t.accentBd}`,marginTop:6,marginBottom:10}}>
                      <span style={{fontSize:11,color:t.accentText}}>Баланс: </span>
                      <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:t.accent,fontSize:mobile?15:13}}>
                        {(dailyAcc[form.account]??DEFAULT_ACCOUNTS[form.account])?.toLocaleString("ru-RU")}
                      </span>
                    </div>
                  )}
                  <F label="Или введите вручную" t={t}>
                    <Inp type="number" value={form.accountManual} onChange={v=>{set("accountManual")(v);set("account")("");}} placeholder="Сумма депозита" t={t} mobile={mobile}/>
                  </F>
                </Card>

                <Card title="Анализ" icon="🔬" t={t}>
                  <F label="Структура" required t={t}><RadioPill options={STRUCTURE} value={form.structure} onChange={set("structure")} cols={3} t={t} mobile={mobile}/></F>
                  <Hr t={t}/>
                  <F label="HTF POI" required t={t}><RadioPill options={HTF_POI} value={form.htfPOI} onChange={set("htfPOI")} cols={3} t={t} mobile={mobile}/></F>
                  <Hr t={t}/>
                  <F label="LTF Entry" required t={t}><RadioPill options={LTF_ENTRY} value={form.ltfEntry} onChange={set("ltfEntry")} cols={mobile?2:5} t={t} mobile={mobile}/></F>
                  <Hr t={t}/>
                  <F label="BoS" t={t}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <RadioPill options={["Да","Нет"]} value={form.bos} onChange={set("bos")} cols={2} t={t} mobile={mobile}/>
                      {form.bos==="Да"&&(
                        <select value={form.bosTF||""} onChange={e=>set("bosTF")(e.target.value)}
                          style={{padding:mobile?"11px 12px":"8px 10px",borderRadius:7,fontSize:mobile?15:13,
                            border:`1.5px solid ${t.inputBd}`,background:t.inputBg,color:t.inputColor,
                            outline:"none",cursor:"pointer",colorScheme:t.colorScheme,minWidth:80}}>
                          <option value="">ТФ</option>
                          {["15M","1H","4H","1D"].map(tf=><option key={tf} value={tf}>{tf}</option>)}
                        </select>
                      )}
                    </div>
                  </F>
                </Card>

                <Card title="Расчет позиции" icon="📈" t={t}>
                  <F label="Тикер" required t={t}>
                    <RadioPill options={[...Object.keys(TICKERS),"Другое"]} value={form.ticker} onChange={v=>{set("ticker")(v);if(v!=="Другое")set("tickerCustom")("");set("contractSizeManual")("");}} cols={mobile?3:5} t={t} mobile={mobile}/>
                    {form.ticker==="Другое"&&(
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>
                        <Inp value={form.tickerCustom} onChange={set("tickerCustom")} placeholder="Название тикера" t={t} mobile={mobile}/>
                        <Inp type="number" value={form.contractSizeManual} onChange={set("contractSizeManual")} placeholder="Contract Size" t={t} mobile={mobile}/>
                      </div>
                    )}
                  </F>
                  {form.ticker&&form.ticker!=="Другое"&&(
                    <div style={{padding:"7px 12px",borderRadius:6,background:t.tabBg,border:`1px solid ${t.tabBd}`,marginBottom:12,fontSize:11,color:t.accentText}}>
                      {TICKERS[form.ticker].name} · Contract: {TICKERS[form.ticker].contractSize} · Pip: {TICKERS[form.ticker].pipValue}
                    </div>
                  )}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                    <F label="SL" required t={t}><Inp type="number" value={form.sl} onChange={set("sl")} placeholder="Стоп" t={t} mobile={mobile}/></F>
                    <F label="Entry" required t={t}><Inp type="number" value={form.entry} onChange={set("entry")} placeholder="Вход" t={t} mobile={mobile}/></F>
                    <F label="Target" required t={t}><Inp type="number" value={form.target} onChange={set("target")} placeholder="Цель" t={t} mobile={mobile}/></F>
                  </div>
                  <Hr t={t}/>
                  <F label="Риск (%)" required t={t}>
                    <RadioPill options={RISK_OPTS} value={form.risk} onChange={v=>{set("risk")(v);set("riskCustom")("");}} cols={4} t={t} mobile={mobile}/>
                    <div style={{marginTop:8}}>
                      <Inp type="number" value={form.riskCustom} onChange={v=>{set("riskCustom")(v);set("risk")("");}} placeholder="Другое значение риска" suffix="%" t={t} mobile={mobile}/>
                    </div>
                  </F>
                  <Hr t={t}/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginTop:10}}>
                    <Computed label="Lot Size" value={lotSize} accent t={t} mobile={mobile}/>
                    <Computed label="R:R" value={rr} unit="R" t={t} mobile={mobile}/>
                    <Computed label="Loss $" value={lossUsd!==""?fmtNum(lossUsd,2):""} t={t} mobile={mobile}/>
                  </div>
                </Card>

                <Card title="Графики" icon="📊" t={t}>
                  <F label="HTF график" t={t}><Inp value={form.htfChart} onChange={set("htfChart")} placeholder="Ссылка на TradingView" t={t} mobile={mobile}/></F>
                  <F label="LTF график" t={t}><Inp value={form.ltfChart} onChange={set("ltfChart")} placeholder="Ссылка на TradingView" t={t} mobile={mobile}/></F>
                </Card>

                <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
                  <button onClick={()=>setTab("pre")} style={bBtn}>← Pre</button>
                  <button onClick={()=>setTab("close")} style={nBtn}>Close →</button>
                </div>
              </div>
            )}

            {/* CLOSE TAB */}
            {tab==="close"&&(
              <div style={{animation:"fadeIn 0.25s ease"}}>
                <Card title="Closed" icon="⏰" t={t}>
                  <F label="Время закрытия" required t={t}>
                    <DTInp value={form.closeTime} onChange={set("closeTime")} t={t} mobile={mobile}/>
                  </F>
                  <Hr t={t}/>
                  <F label="Результат" t={t}>
                    <RadioPill options={RESULTS_BASE} value={form.result} onChange={v=>{set("result")(v);if(v)set("resultCustom")("");}} cols={3} t={t} mobile={mobile}/>
                    <div style={{marginTop:8}}>
                      <Inp value={form.resultCustom} onChange={v=>{set("resultCustom")(v);if(v)set("result")("");}} placeholder="Другой результат..." t={t} mobile={mobile}/>
                    </div>
                  </F>
                  <Hr t={t}/>
                  <F label="Закрыта по плану?" t={t}>
                    <RadioPill options={["Да","Нет"]} value={form.closedByPlan} onChange={set("closedByPlan")} cols={2} t={t} mobile={mobile}/>
                  </F>
                </Card>

                <Card title="Выход из позиции" icon="💰" t={t}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <F label="Price 1" t={t}><Inp type="number" value={form.price1} onChange={set("price1")} placeholder="Цена" t={t} mobile={mobile}/></F>
                    <F label="Lots 1" t={t}><Inp type="number" value={form.lots1} onChange={set("lots1")} placeholder="Лоты" t={t} mobile={mobile}/></F>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:4}}>
                    <F label="Price 2" t={t}><Inp type="number" value={form.price2} onChange={set("price2")} placeholder="Цена" t={t} mobile={mobile}/></F>
                    <F label="Lots 2" t={t}><Inp type="number" value={form.lots2} onChange={set("lots2")} placeholder="Лоты" t={t} mobile={mobile}/></F>
                  </div>
                  <div style={{marginTop:12}}>
                    <Computed label="PnL (авто)" value={pnl!==""?fmtNum(pnl):""} unit={form.ticker?TICKERS[form.ticker]?.name:""} accent={pnl>0} t={t} mobile={mobile}/>
                  </div>
                </Card>

                <Card title="Графики закрытия" icon="📊" t={t}>
                  <F label="HTF close" t={t}><Inp value={form.htfClose} onChange={set("htfClose")} placeholder="Ссылка на TradingView" t={t} mobile={mobile}/></F>
                  <F label="LTF close" t={t}><Inp value={form.ltfClose} onChange={set("ltfClose")} placeholder="Ссылка на TradingView" t={t} mobile={mobile}/></F>
                </Card>

                <Card title="Рефлексия" icon="📝" t={t}>
                  <F label="Что привело к такому решению?" t={t}>
                    <TArea value={form.reason} onChange={set("reason")} placeholder="Опишите свои мысли..." t={t} mobile={mobile}/>
                  </F>
                  <F label="Как буду вести себя в будущем?" t={t}>
                    <TArea value={form.futureBehavior} onChange={set("futureBehavior")} placeholder="Опишите выводы..." t={t} mobile={mobile}/>
                  </F>
                </Card>

                <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
                  <button onClick={()=>setTab("entry")} style={bBtn}>← Entry</button>
                  <button onClick={saveDeal} style={nBtn}>
                    {editIdx!==null?"💾 Обновить":"✓ Сохранить"}
                  </button>
                </div>
              </div>
            )}
          </>
        )}
      </div>

      {/* BOTTOM NAV BAR on mobile when in form view */}
      {mobile&&view==="form"&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,background:t.headerBg,borderTop:`1px solid ${t.headerBd}`,display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom)"}}>
          {TABS.map(tb=>{
            const active=tab===tb.id,pct=Math.round(prog[tb.id]*100);
            return(
              <button key={tb.id} onClick={()=>setTab(tb.id)} style={{flex:1,padding:"10px 4px 8px",background:"transparent",border:"none",cursor:"pointer",touchAction:"manipulation"}}>
                <div style={{fontSize:18,marginBottom:2}}>{tb.icon}</div>
                <div style={{fontSize:11,fontWeight:active?800:500,color:active?t.accent:t.textMuted}}>{tb.label}</div>
                <div style={{margin:"4px auto 0",width:28,height:3,borderRadius:2,background:t.divider,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:pct===100?t.accent:t.accentText,borderRadius:2}}/>
                </div>
              </button>
            );
          })}
        </div>
      )}

      <style>{`
    
    /* Force full-width on large screens */
    @media (min-width: 1400px) {
      #root { width: 100% !important; }
      #root > div { width: 100% !important; }
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
        input[type=number]{-moz-appearance:textfield}
        ::-webkit-scrollbar{height:5px;width:5px}
        ::-webkit-scrollbar-track{background:${t.scrollTrack}}
        ::-webkit-scrollbar-thumb{background:${t.scrollThumb};border-radius:3px}
        *{box-sizing:border-box}
        input,textarea,button{-webkit-tap-highlight-color:transparent}
      `}</style>
    </div>
  );
}

    const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(TradingJournal));
  </script>
</body>
</html>
